name: 构建洛茜工具箱 APK

on:
  push:
    branches:
      - main
      - master
      - dev
      - ci
    paths:
      - 'manager/**'
      - '.github/workflows/build-luoxi-toolbox.yml'
  pull_request:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MANAGER_DIR: ./manager
  GRADLE_OPTS: -Dorg.gradle.parallel=true -Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process

jobs:
  build-apk:
    name: 构建 APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: 准备签名密钥（Secrets）
        id: realkey
        if: ${{ github.event_name != 'pull_request' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            mkdir -p "$MANAGER_DIR/.signing"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$MANAGER_DIR/.signing/key.jks"
            {
              echo "KEYSTORE_FILE=../.signing/key.jks"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$MANAGER_DIR/gradle.properties"
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: 生成临时签名密钥（PR/未配置 Secrets）
        id: tempkey
        if: ${{ steps.realkey.outputs.found != 'true' }}
        run: |
          mkdir -p "$MANAGER_DIR/.signing"
          keytool -genkeypair -v \
            -keystore "$MANAGER_DIR/.signing/key.jks" \
            -storepass "luoxi123" \
            -alias "luoxi" \
            -keypass "luoxi123" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 7 \
            -dname "CN=LuoxiToolbox, OU=Build, O=Luoxi, L=Local, ST=CN, C=CN"
          {
            echo "KEYSTORE_FILE=../.signing/key.jks"
            echo "KEYSTORE_PASSWORD=luoxi123"
            echo "KEY_ALIAS=luoxi"
            echo "KEY_PASSWORD=luoxi123"
          } >> "$MANAGER_DIR/gradle.properties"

      - name: 写入构建属性（包名）
        run: |
          {
            echo "# 洛茜工具箱构建属性"
            echo "KSU_PACKAGE_NAME=me.luoxi.toolbox"
          } >> "$MANAGER_DIR/gradle.properties"
          cat "$MANAGER_DIR/gradle.properties"
          # 注意：KSU_NAME 不在此处写入，因为 Java properties 文件
          # 默认用 ISO-8859-1 读取，中文会乱码。应用名「洛茜工具箱」
          # 由 build.gradle.kts 的 defaultManagerName（UTF-8 源码）提供。

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ runner.os }}-gradle-cache
          build-root-directory: ${{ env.MANAGER_DIR }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build Release APK
        working-directory: ${{ env.MANAGER_DIR }}
        run: |
          IS_PR_BUILD=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then IS_PR_BUILD=true; fi
          set -x
          ./gradlew clean assembleRelease -PIS_PR_BUILD=$IS_PR_BUILD --no-daemon --stacktrace

      - name: 收集 APK
        run: |
          mkdir -p dist
          find "$MANAGER_DIR/app/build/outputs/apk/release" -name "*.apk" -type f -print -exec cp {} dist/ \;
          ls -la dist/

      - name: 上传 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luoxi-toolbox-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 发布 APK 到 Release（直链下载）
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: luoxi-${{ github.run_number }}
          name: 洛茜工具箱 #${{ github.run_number }}
          body: |
            ## 洛茜工具箱 APK 直链
            最新构建版本，可直接下载安装。
          files: dist/*.apk
